services:
  - type: web
    name: essential-dialer
    runtime: node
    repo: https://github.com/AbuZar-Babar/80-20-OUTBOUND-SYSTEM
    branch: main
    rootDir: NewCode
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
